<script>try{var th0=localStorage.getItem("mt_theme");if(th0=="light"||th0=="dark")document.documentElement.setAttribute("data-theme",th0)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f2f4ee;--card:#fff;--ink:#14281d;--mut:#5d6b62;--line:#d9dfd3;--ok:#1f7a4d;--okbg:#dff1e6;--warn:#8a5a00;--warnbg:#fbe9b8;--bad:#b3261e;--badbg:#f8d9d6;--btn:#2f8a5d;--btnink:#fff;--hd:#cfe6d9;--hdink:#17402b;--hdl:#8fbea5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101a14;--card:#182419;--ink:#eaf1ea;--mut:#9db0a2;--line:#2b3b2f;--ok:#6fd49b;--okbg:#1c3a29;--warn:#f2c14e;--warnbg:#3b3011;--bad:#ff8a80;--badbg:#431d1a;--btn:#eaf1ea;--btnink:#14281d;--hd:#1f3a2a;--hdink:#eaf1ea;--hdl:#4f7a60}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101a14;--card:#182419;--ink:#eaf1ea;--mut:#9db0a2;--line:#2b3b2f;--ok:#6fd49b;--okbg:#1c3a29;--warn:#f2c14e;--warnbg:#3b3011;--bad:#ff8a80;--badbg:#431d1a;--btn:#eaf1ea;--btnink:#14281d;--hd:#1f3a2a;--hdink:#eaf1ea;--hdl:#4f7a60}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.3;font-size:14px}
main{max-width:560px;margin:0 auto;padding:10px 10px 30px}@media(min-width:800px){main{max-width:1240px;padding:16px 28px 40px}
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-items:start}#list .card{margin-bottom:0}
#list .card.open{grid-column:1/-1}
#tot{max-width:760px;margin:0 auto}#dosl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-items:start}
#perf{max-width:900px;margin:0 auto}
#set,#v-add,#v-talk,#v-dos,#v-log{max-width:760px;margin-left:auto;margin-right:auto}}

h1{font-size:21px;margin:2px 0 0;letter-spacing:-.5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--mut);margin:0 0 10px;font-size:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.sum div{border-radius:9px;padding:7px 4px;text-align:center}
.sum b{display:block;font-size:20px;line-height:1}
.sum span{font-size:10px}
.s-bad{background:var(--badbg);color:var(--bad)}.s-warn{background:var(--warnbg);color:var(--warn)}.s-ok{background:var(--okbg);color:var(--ok)}.s-ex{background:#c9ecd6;color:#14653a}@media (prefers-color-scheme:dark){.s-ex{background:#1d4a31;color:#9be0b8}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden}
.card.bad{border-left:4px solid var(--bad)}.card.warn{border-left:4px solid var(--warn)}.card.ok{border-left:4px solid var(--ok)}
.head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.head:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.nm{font-weight:700;font-size:14px}.pl{color:var(--mut);font-size:11px}
.grow{flex:1;min-width:0}
.tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;white-space:nowrap}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}
.flag{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--bad);background:var(--badbg);padding:2px 8px;border-radius:99px}
.body{padding:0 10px 10px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.row:last-of-type{border-bottom:0}
.row small{display:block;color:var(--mut);font-size:11px}
.d{font-weight:700;font-size:11px}.d.bad{color:var(--bad)}.d.warn{color:var(--warn)}.d.ok{color:var(--ok)}
input,textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
