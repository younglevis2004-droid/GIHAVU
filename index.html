<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abamotari</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ee;--card:#fff;--ink:#14281d;--mut:#5d6b62;--line:#d9dfd3;--ok:#1f7a4d;--okbg:#dff1e6;--warn:#8a5a00;--warnbg:#fbe9b8;--bad:#b3261e;--badbg:#f8d9d6;--btn:#14281d;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#182419;--ink:#eaf1ea;--mut:#9db0a2;--line:#2b3b2f;--ok:#6fd49b;--okbg:#1c3a29;--warn:#f2c14e;--warnbg:#3b3011;--bad:#ff8a80;--badbg:#431d1a;--btn:#eaf1ea;--btnink:#14281d}}
:root[data-theme="dark"]{--bg:#101a14;--card:#182419;--ink:#eaf1ea;--mut:#9db0a2;--line:#2b3b2f;--ok:#6fd49b;--okbg:#1c3a29;--warn:#f2c14e;--warnbg:#3b3011;--bad:#ff8a80;--badbg:#431d1a;--btn:#eaf1ea;--btnink:#14281d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sum div{border-radius:10px;padding:10px 8px;text-align:center}
.sum b{display:block;font-size:30px;line-height:1}
.sum span{font-size:12px}
.s-bad{background:var(--badbg);color:var(--bad)}.s-warn{background:var(--warnbg);color:var(--warn)}.s-ok{background:var(--okbg);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card.bad{border-left:6px solid var(--bad)}.card.warn{border-left:6px solid var(--warn)}.card.ok{border-left:6px solid var(--ok)}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.head:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.nm{font-weight:700;font-size:17px}.pl{color:var(--mut);font-size:13px}
.grow{flex:1;min-width:0}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}
.body{padding:0 14px 14px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-of-type{border-bottom:0}
.row small{display:block;color:var(--mut)}
.d{font-weight:700;font-size:13px}.d.bad{color:var(--bad)}.d.warn{color:var(--warn)}.d.ok{color:var(--ok)}
input{font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
button.b{font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.b.main{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
button.b.del{color:var(--bad)}
.step{display:flex;align-items:center;gap:10px}.step b{min-width:18px;text-align:center}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
details.add{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
details.add summary{font-weight:700;cursor:pointer}
.f{display:grid;gap:8px;margin-top:10px}.f label{font-size:13px;color:var(--mut);display:grid;gap:3px}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--okbg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.pb{font-weight:700;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.note{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<main>
<section id="login"><h1>Abamotari</h1><p class="sub">Injira kugira ngo ubone amakuru.</p><div class="f"><label>Imeli<input id="em" type="email" autocomplete="username"></label><label>Ijambo ry’ibanga<input id="pw" type="password" autocomplete="current-password"></label><button class="b main" id="lb">Injira</button><p id="le" class="d bad"></p></div></section>
<div id="app" hidden><h1>Abamotari</h1>
<p class="sub">Kurikirana buri mumotari: ibyangombwa n’imikorere ye.</p>
<div class="sum" id="sum"></div>
<details class="add"><summary>Ongeraho umumotari</summary>
<div class="f">
<label>Amazina<input id="n" placeholder="Urugero: Jean Claude"></label>
<label>Plaque ya moto<input id="p" placeholder="RF 123 A"></label>
<label>Telefone<input id="t" inputmode="tel" placeholder="078..."></label>
<label>Ifoto<input id="ph" type="file" accept="image/*"></label>
<label>Permis irangira<input id="e1" type="date"></label>
<label>Ubwishingizi burangira<input id="e2" type="date"></label>
<label>Isuzuma rya moto rirangira<input id="e3" type="date"></label>
<button class="b main" id="addb">Bika umumotari</button>
</div></details>
<div id="list"></div>
<p class="note"><button class="b" id="out">Sohoka</button></p></div>
</main>
<script>setTimeout(function(){if(!window.__ok){var e=document.getElementById("le");if(e)e.textContent="Page ntishoboye gufungura. Igomba gushyirwa kuri Netlify (ntifungurirwa muri telefone nk’idosiye)."}},3000)</script>
<script type="module">
window.__ok=1;
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBJbfDI8XBzANqou4zlPeQ2M-rS-8-PTzk",authDomain:"gihavu-14ad4.firebaseapp.com",projectId:"gihavu-14ad4",appId:"1:825227843232:web:db22900a707cdfec889bc5"};
var app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
var open=null,data=[],ready=false,msg="",unsub=null;
function iso(off){var d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)}
function sample(){return[
{id:1,n:"Jean Claude Habimana",p:"RF 214 B",t:"0788 000 111",doc:[iso(-5),iso(120),iso(200)],days:6,paid:true,amt:15000},
{id:2,n:"Eric Nsengiyumva",p:"RG 087 C",t:"0722 000 222",doc:[iso(200),iso(12),iso(90)],days:4,paid:false,amt:15000},
{id:3,n:"Patrick Uwimana",p:"RE 556 A",t:"0733 000 333",doc:[iso(300),iso(250),iso(180)],days:7,paid:true,amt:15000},
{id:4,n:"Emmanuel Mugisha",p:"RF 902 D",t:"0781 000 444",doc:[iso(25),iso(-2),iso(60)],days:2,paid:false,amt:15000}]}
var L=document.getElementById("login"),A=document.getElementById("app");
onAuthStateChanged(auth,function(u){L.hidden=!!u;A.hidden=!u;
if(u){unsub=onSnapshot(collection(db,"motari"),function(q){ready=true;msg="";data=q.docs.map(function(x){var o=x.data();o.id=x.id;return o});render()},function(){msg="Amakuru ntashoboye gusomwa. Reba interineti.";render()})}
else{if(unsub)unsub();data=[];ready=false}});
document.getElementById("lb").onclick=function(){var e=document.getElementById("le");
signInWithEmailAndPassword(auth,document.getElementById("em").value.trim(),document.getElementById("pw").value).catch(function(){e.textContent="Imeli cyangwa ijambo ry’ibanga si byo."})};
document.getElementById("out").onclick=function(){signOut(auth)};
function av(x){return x.photo?'<img class="av" src="'+x.photo+'" alt="">':'<span class="av">'+esc((x.n||"?").trim().charAt(0).toUpperCase())+'</span>'}
function shrink(f,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};i.src=r.result};r.readAsDataURL(f)}
var newPhoto="";
function persist(x){setDoc(doc(db,"motari",x.id),x).catch(function(){alert("Ntibyabitswe. Gerageza nanone.")})}
function seed(){sample().forEach(function(x){x.id=String(x.id);persist(x)})}
var NAMES=["Permis","Ubwishingizi","Isuzuma rya moto"];
function left(d){if(!d)return 9999;var a=new Date(d+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function st(x){var m=Math.min.apply(null,x.doc.map(left));return m<0?"bad":m<=30?"warn":"ok"}
function lab(n){return n<0?"Cyarangiye "+(-n)+" ("+(-n==1?"umunsi":"iminsi")+" ishize)":n==0?"Kirarangira uyu munsi":n>=9999?"Nta tariki":"Hasigaye iminsi "+n}
function cls(n){return n<0?"bad":n<=30?"warn":"ok"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
var c={bad:0,warn:0,ok:0};data.forEach(function(x){c[st(x)]++});
document.getElementById("sum").innerHTML='<div class="s-bad"><b>'+c.bad+'</b><span>Byarangiye</span></div><div class="s-warn"><b>'+c.warn+'</b><span>Bigiye kurangira</span></div><div class="s-ok"><b>'+c.ok+'</b><span>Ni byiza</span></div>';
var o={bad:0,warn:1,ok:2};
var sorted=data.slice().sort(function(a,b){return o[st(a)]-o[st(b)]});
document.getElementById("list").innerHTML=sorted.map(function(x){
var s=st(x),m=Math.min.apply(null,x.doc.map(left));
var h='<div class="card '+s+'"><button class="head" data-o="'+x.id+'" aria-expanded="'+(open===x.id)+'">'+av(x)+'<span class="grow"><span class="nm">'+esc(x.n)+'</span><br><span class="pl">'+esc(x.p)+' · '+esc(x.t)+'</span></span><span class="tag '+s+'">'+(s=="bad"?"Hari cyarangiye":s=="warn"?"Iminsi "+m:"Ni byiza")+'</span></button>';
if(open===x.id){h+='<div class="body"><div class="row"><span>Ifoto</span><label class="pb">Hindura ifoto<input type="file" accept="image/*" data-ph="'+x.id+'" hidden></label></div>';
x.doc.forEach(function(d,i){var n=left(d);h+='<div class="row"><span>'+NAMES[i]+'<small class="d '+cls(n)+'">'+lab(n)+'</small></span><input type="date" value="'+d+'" data-d="'+x.id+'" data-i="'+i+'" aria-label="'+NAMES[i]+'"></div>'});
h+='<div class="row"><span>Iminsi yakoze iki cyumweru<div class="bar"><i style="width:'+(x.days/7*100)+'%"></i></div></span><span class="step"><button class="b" data-k="'+x.id+'" data-v="-1" aria-label="Gabanya">−</button><b>'+x.days+'/7</b><button class="b" data-k="'+x.id+'" data-v="1" aria-label="Ongera">+</button></span></div>';
h+='<div class="row"><span>Yishyuye iki cyumweru<small>'+x.amt.toLocaleString("fr-RW")+' RWF</small></span><button class="b '+(x.paid?"main":"")+'" data-p="'+x.id+'">'+(x.paid?"Yishyuye":"Ntiyishyuye")+'</button></div>';
h+='<div class="row"><a href="tel:'+esc(x.t.replace(/\s/g,""))+'" class="b" style="text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px">Muhamagare</a><button class="b del" data-x="'+x.id+'">Mukure</button></div></div>'}
return h+'</div>'}).join("")||'<p class="sub">'+(msg||(ready?"Nta mumotari urongerwaho. Ongeraho uwa mbere hejuru.":"Birimo gufungura…"))+'</p>'+(ready&&!data.length?'<button class="b" data-s="1">Shyiraho abo kugerageza</button>':'')}
function find(id){return data.filter(function(x){return x.id==id})[0]}
document.addEventListener("click",function(e){
var t=e.target.closest("[data-o],[data-k],[data-p],[data-x],[data-s],#addb");if(!t)return;
if(t.id=="addb"){var n=document.getElementById("n").value.trim();if(!n){alert("Andika amazina y’umumotari.");return}
persist({id:String(Date.now()),n:n,p:document.getElementById("p").value||"-",t:document.getElementById("t").value||"-",doc:[document.getElementById("e1").value,document.getElementById("e2").value,document.getElementById("e3").value],days:0,paid:false,amt:15000,photo:newPhoto});newPhoto="";document.getElementById("ph").value="";
["n","p","t","e1","e2","e3"].forEach(function(i){document.getElementById(i).value=""});document.querySelector("details.add").open=false}
else if(t.dataset.s){seed()}else if(t.dataset.o){var id=t.dataset.o;open=open===id?null:id}
else if(t.dataset.k){var x=find(t.dataset.k);x.days=Math.max(0,Math.min(7,x.days+ +t.dataset.v));persist(x)}
else if(t.dataset.p){var y=find(t.dataset.p);y.paid=!y.paid;persist(y)}
else if(t.dataset.x){if(confirm("Ukureho uyu mumotari?")){deleteDoc(doc(db,"motari",t.dataset.x));open=null}else return}
render()});
document.addEventListener("change",function(e){var t=e.target;if(t.id=="ph"&&t.files[0]){shrink(t.files[0],function(u){newPhoto=u})}if(t.dataset.ph&&t.files[0]){shrink(t.files[0],function(u){var z=find(t.dataset.ph);z.photo=u;persist(z)})}if(t.dataset.d){var x=find(t.dataset.d);x.doc[+t.dataset.i]=t.value;persist(x);render()}});
render();
</script>
</body>
</html>
